<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName planifyplus.freeddns.org
    ServerAlias www.planifyplus.freeddns.org
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/planifyplus.freeddns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/planifyplus.freeddns.org/privkey.pem

    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName planifyplus.freeddns.org
    ServerAlias www.planifyplus.freeddns.org
    Redirect permanent / https://planifyplus.freeddns.org/
</VirtualHost>
